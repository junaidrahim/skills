[project]
name = "__PROJECT_SLUG__"
version = "0.1.0"
description = "Portable applied-AI research project"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4,<2",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<3",
]

[project.scripts]
research = "research_project.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_project"]

[tool.uv]
package = true
